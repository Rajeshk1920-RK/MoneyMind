name: moneymind_flutter
description: "MoneyMind - AI Powered Smart Personal Finance & SMS Expense Tracker App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Local Database & Storage
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # UI, Icons & Design
  intl: ^0.19.0
  google_fonts: ^6.2.1
  lucide_icons: ^0.252.0
  fl_chart: ^0.68.0
  uuid: ^4.4.0

  # Native & Permissions
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
